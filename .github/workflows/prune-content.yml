name: Prune content

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-automation-main
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Run content automation
        uses: ./.github/actions/content-automation
        with:
          mode: prune
          branch: automation/prune-content
          commit-message: 'chore(content): prune content'
          title: コンテンツを整理
          description: ディレクトリごとの保持件数を適用し、無効リンクを除去します。
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
