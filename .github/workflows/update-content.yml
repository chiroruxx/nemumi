name: Update content

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      service:
        description: Service to sync
        type: choice
        required: true
        default: all
        options:
          - all
          - sizu
          - hatena
          - speakerdeck

permissions:
  contents: read

concurrency:
  group: content-automation-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-26.04
    # 3 syncs and the shared link check each receive an 8-minute execution budget.
    timeout-minutes: 40
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Run content automation
        uses: ./.github/actions/content-automation
        with:
          mode: sync
          service: ${{ inputs.service || 'all' }}
          branch: automation/update-content
          commit-message: 'chore(content): sync external content'
          title: コンテンツを同期
          description: RSS の内容を同期します。
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          auto-merge: ${{ vars.CONTENT_AUTO_MERGE }}
