name: Update content

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      service:
        description: Service to sync
        type: choice
        required: true
        default: all
        options:
          - all
          - sizu
          - hatena
          - speakerdeck

permissions:
  contents: read

concurrency:
  group: content-automation-main
  cancel-in-progress: false

jobs:
  select-services:
    runs-on: ubuntu-26.04
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SERVICE: ${{ inputs.service }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$SELECTED_SERVICE" = "all" ]; then
            echo 'services=["sizu","hatena","speakerdeck"]' >> "$GITHUB_OUTPUT"
          else
            echo "services=[\"$SELECTED_SERVICE\"]" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: select-services
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select-services.outputs.services) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Run content automation
        uses: ./.github/actions/content-automation
        with:
          mode: sync
          service: ${{ matrix.service }}
          branch: automation/update-${{ matrix.service }}
          commit-message: 'chore(content): sync ${{ matrix.service }} feed'
          title: 'コンテンツを同期: ${{ matrix.service }}'
          description: RSS の内容を同期します。
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          auto-merge: ${{ vars.CONTENT_AUTO_MERGE }}
