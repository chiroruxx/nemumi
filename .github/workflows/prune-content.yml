name: Prune content

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-automation-main
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prune saved content
        run: mise run prune-content

      - name: Check saved content links
        id: check-links
        uses: ./.github/actions/check-content-links

      - name: Create or update content pull request
        uses: ./.github/actions/content-pull-request
        with:
          branch: automation/prune-content
          commit-message: 'chore(content): prune content'
          title: コンテンツを整理
          description: ディレクトリごとの保持件数を適用し、無効リンクを除去します。
          summary: ${{ steps.check-links.outputs.summary }}
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          auto-merge: ${{ vars.CONTENT_AUTO_MERGE }}
