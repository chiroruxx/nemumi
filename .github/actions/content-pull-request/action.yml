name: Create content pull requests
description: Create or update a content pull request and optionally enable auto-merge.
inputs:
  branch:
    description: Persistent automation branch name.
    required: true
  commit-message:
    description: Commit message for generated changes.
    required: true
  title:
    description: Pull request title.
    required: true
  description:
    description: Introductory pull request body text.
    required: true
  summary:
    description: Summary of URLs whose public status could not be confirmed.
    required: true
  client-id:
    description: GitHub App client ID.
    required: true
  private-key:
    description: GitHub App private key.
    required: true
  # Composite action 内で vars を直接参照せず、呼び出し元から渡す。未指定時は自動マージを要求しない。
  auto-merge:
    description: Request auto-merge only when the value is the string true.
    required: false
    default: 'false'
  add-paths:
    description: Content YAML paths that the pull request may stage.
    required: false
    default: |
      src/content/articles/*.yaml
      src/content/talks/*.yaml
runs:
  using: composite
  steps:
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}

    - name: Create or update content pull request
      id: pull-request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.app-token.outputs.token }}
        branch: ${{ inputs.branch }}
        base: main
        delete-branch: false
        commit-message: ${{ inputs.commit-message }}
        author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
        committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        title: ${{ inputs.title }}
        body: |
          ${{ inputs.description }}

          ${{ inputs.summary }}

          ${{ inputs.auto-merge == 'true' && '必須 CI 成功後に自動マージします。' || 'この実行では自動マージを要求しません。設定済みの場合は解除し、内容を確認して手動でマージしてください。' }}
        add-paths: ${{ inputs.add-paths }}

    - name: Enable auto-merge
      if: inputs.auto-merge == 'true' && steps.pull-request.outputs.pull-request-number != '' && steps.pull-request.outputs.pull-request-operation != 'closed'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
      run: gh pr merge "$PR_NUMBER" --auto --squash
