name: Update content

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      service:
        description: Service to sync
        type: choice
        required: true
        default: all
        options:
          - all
          - sizu
          - hatena
          - speakerdeck

permissions:
  contents: read

concurrency:
  group: content-automation-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-26.04
    # 3 syncs and the shared link check each receive an 8-minute execution budget.
    timeout-minutes: 40
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate sync service
        env:
          SYNC_SERVICE: ${{ inputs.service || 'all' }}
        run: |
          case "$SYNC_SERVICE" in
            all|sizu|hatena|speakerdeck) ;;
            *) echo "Unsupported content service" >&2; exit 1 ;;
          esac

      - name: Sync sizu content
        if: inputs.service == 'all' || inputs.service == 'sizu' || github.event_name == 'schedule'
        run: mise run sync-content -- sizu

      - name: Sync hatena content
        if: inputs.service == 'all' || inputs.service == 'hatena' || github.event_name == 'schedule'
        run: mise run sync-content -- hatena

      - name: Sync speakerdeck content
        if: inputs.service == 'all' || inputs.service == 'speakerdeck' || github.event_name == 'schedule'
        run: mise run sync-content -- speakerdeck

      - name: Check saved content links
        id: check-links
        uses: ./.github/actions/check-content-links

      - name: Prune saved content
        run: mise run prune-content

      - name: Create or update content pull request
        uses: ./.github/actions/content-pull-request
        with:
          branch: automation/update-content
          commit-message: 'chore(content): update external content'
          title: コンテンツを更新
          description: RSS を同期し、無効リンクの除去とディレクトリごとの保持件数の整理を行います。
          summary: ${{ steps.check-links.outputs.summary }}
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          auto-merge: ${{ vars.CONTENT_AUTO_MERGE }}
