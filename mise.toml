[tools]
pnpm = "12"

[settings]
# Node.js は Cloudflare Workers Builds と共通の .node-version で指定する
idiomatic_version_file_enable_tools = ["node"]

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install"

[tasks.dev]
description = "開発サーバを起動する"
run = "pnpm dev"

[tasks.build]
description = "本番用にビルドする"
run = "pnpm build"

[tasks.preview]
description = "ビルド結果をローカルで確認する"
run = "pnpm preview"

[tasks.sync-content]
description = "指定したサービスの RSS からコンテンツを同期する"
run = "pnpm sync-content"

[tasks.prune-content]
description = "保持件数を適用し、無効リンクを除去する"
run = "pnpm prune-content"

[tasks.lint]
description = "Biome と Stylelint でコードをチェックする"
run = "pnpm lint"

[tasks.format]
description = "Biome でコードを整形する"
run = "pnpm format"

[tasks.check]
description = "Astro で型チェックする"
run = "pnpm check"

[tasks.test]
description = "fixture コンテンツで生成ページをテストする"
run = "pnpm test"

[tasks.lighthouse-ci]
description = "Lighthouse CI でビルド成果物を検査する"
run = "pnpm lighthouse:ci"
