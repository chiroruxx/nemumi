[tools]
pnpm = "12.16.1"

[settings]
# Node.js は Cloudflare Workers Builds と共通の .node-version で指定する
idiomatic_version_file_enable_tools = ["node"]

[env]
_.file = ".env"

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install"

[tasks.dev]
description = "開発サーバを起動する"
run = "pnpm dev"

[tasks.build]
description = "本番用にビルドする"
run = "pnpm build"

[tasks.preview]
description = "ビルド結果をローカルで確認する"
run = "pnpm preview"

[tasks.sync-content]
description = "指定したサービスの RSS からコンテンツを同期する"
run = "pnpm sync-content"

[tasks.prune-content]
description = "保存済みコンテンツに保持件数を適用する"
run = "pnpm prune-content"

[tasks.check-content-links]
description = "保存済みコンテンツのリンクを確認し、無効リンクを除去する"
run = "pnpm check-content-links"

[tasks.check-exported-function-tests]
description = "export 関数の直接テストを確認する"
run = "pnpm check:exported-function-tests"

[tasks.lint]
description = "Biome、Stylelint、export 関数、未使用コードをチェックする"
run = "pnpm lint"

[tasks.format]
description = "Biome でコードを整形する"
run = "pnpm format"

[tasks.check]
description = "Astro で型チェックする"
run = "pnpm check"

[tasks.test]
description = "Astro をビルドし、Node.js の glob test runner でテストする"
run = "pnpm test"

[tasks.lighthouse-ci]
description = "Lighthouse CI でビルド成果物を検査する"
run = "pnpm lighthouse:ci"

[tasks.ci]
description = "CI と push 前に lint、型チェック、テスト、build を実行する"
run = "mise run lint && mise run check && mise run test && mise run build"
